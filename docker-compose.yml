# =============================================================================
# 日历视图 Docker 部署（HTTPS 生产就绪版）
# =============================================================================
#
# 方式1：SQLite + Nginx HTTPS 部署（个人/小范围）
#   docker compose --profile sqlite up -d
#   → https://your-domain.com
#
# 方式2：MySQL + Nginx HTTPS 生产部署（团队/高可用）
#   docker compose --profile mysql up -d
#   → https://your-domain.com
#
# 前置条件（备案通过后执行）：
#   1. 域名已解析到服务器 IP
#   2. SSL 证书已申请（Let's Encrypt），放置于 ./ssl/live/your-domain.com/
#   3. nginx.conf 及 .env 中 your-domain.com 已替换为实际域名
#   4. 复制 .env.example 为 .env 并填写所有敏感值
#
# 临时调试（无 SSL 证书时）：
#   取消注释 app.ports 下的 "5000:5000"，直接通过 http://IP:5000 访问
#
# 敏感信息说明：
#   所有密码、密钥、域名均通过 .env 文件注入，不硬编码于此文件。
#   .env 文件已被 .gitignore 忽略，不会提交到版本控制。
#
# 切换数据库：修改 .env 中 CALENDAR_DB_TYPE 即可
# =============================================================================

services:

  # ========== Flask 应用（内部服务，不直接暴露端口）==========
  app:
    build: .
    container_name: calendar-app
    restart: unless-stopped
    # 生产环境不直接暴露端口，由 Nginx 反向代理
    # 临时调试（无 SSL）时可取消注释下方端口映射：
    # ports:
    #   - "5000:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY:?请在 .env 文件中设置 SECRET_KEY}
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD:-}
      - CALENDAR_DB_TYPE=${CALENDAR_DB_TYPE:-sqlite}
      - CALENDAR_DB_PATH=/app/data/calendar.db
      # CORS 允许的跨域来源（逗号分隔），生产环境必须设置为具体域名
      - CALENDAR_CORS_ORIGINS=${CALENDAR_CORS_ORIGINS:-}
      # 备案信息
      - ICP_NUMBER=${ICP_NUMBER:-}
      - PUBLIC_SECURITY_NUMBER=${PUBLIC_SECURITY_NUMBER:-}
      # MySQL 连接（仅当 CALENDAR_DB_TYPE=mysql 时生效）
      - CALENDAR_MYSQL_HOST=mysql
      - CALENDAR_MYSQL_PORT=3306
      - CALENDAR_MYSQL_USER=calendar
      - CALENDAR_MYSQL_PASSWORD=${MYSQL_PASSWORD:?请在 .env 文件中设置 MYSQL_PASSWORD}
      - CALENDAR_MYSQL_DB=calendar
    volumes:
      # SQLite 持久化 → 宿主机 ./calendar/data
      - ./calendar/data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
        required: false
    profiles:
      - sqlite
      - mysql
    networks:
      - calendar-net

  # ========== Nginx 反向代理（HTTPS 终止 + 安全头）==========
  nginx:
    image: nginx:alpine
    container_name: calendar-nginx
    restart: unless-stopped
    ports:
      - "80:80"     # HTTP → HTTPS 强制跳转
      - "443:443"   # HTTPS 主服务
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # SSL 证书挂载（部署前确保证书已放置于 ./ssl/live/your-domain.com/）
      # 目录结构需与 Let's Encrypt 一致：./ssl/live/<域名>/fullchain.pem、privkey.pem
      - ./ssl:/etc/letsencrypt:ro
    depends_on:
      - app
    profiles:
      - sqlite
      - mysql
    networks:
      - calendar-net

  # ========== MySQL 数据库（可选） ==========
  mysql:
    image: mysql:8.0
    container_name: calendar-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 文件中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: calendar
      MYSQL_USER: calendar
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 文件中设置 MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      # MySQL 持久化 → 宿主机 ./calendar/mysql
      - ./calendar/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "calendar", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - mysql
    networks:
      - calendar-net

networks:
  calendar-net:
    driver: bridge
